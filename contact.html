<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | BusGo</title>

<link rel="stylesheet" href="css/contact.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>



<!-- HEADER -->

<header>


<div class="logo">

<i class="fa-solid fa-bus"></i>

BusGo

</div>



<nav>

<a href="index.html">
Home
</a>


<a href="dashboard.html">
Dashboard
</a>


<a href="bookings.html">
Bookings
</a>


<a href="profile.html">
Profile
</a>


</nav>



</header>







<!-- HERO -->


<section class="contact-hero">


<h1>
Contact BusGo
</h1>


<p>
We are here to help you with your travel needs.
</p>


</section>







<!-- CONTACT SECTION -->


<section class="contact-container">





<div class="contact-info">


<h2>
Get In Touch
</h2>



<div class="info-item">


<i class="fa fa-phone"></i>


<div>

<h3>
Phone
</h3>

<p>
+256 700 000000
</p>

</div>


</div>






<div class="info-item">


<i class="fa fa-envelope"></i>


<div>

<h3>
Email
</h3>

<p>
support@busgo.com
</p>

</div>


</div>







<div class="info-item">


<i class="fa fa-location-dot"></i>


<div>

<h3>
Office
</h3>

<p>
Kampala, Uganda
</p>

</div>


</div>



</div>








<!-- CONTACT FORM -->


<div class="contact-form">


<h2>
Send Message
</h2>



<form id="contactForm">


<input 
type="text"
id="name"
placeholder="Full Name"
required>



<input 
type="email"
id="email"
placeholder="Email Address"
required>



<input 
type="text"
id="subject"
placeholder="Subject"
required>




<textarea

id="message"

placeholder="Your Message"

rows="6"

required>

</textarea>




<button>

<i class="fa fa-paper-plane"></i>

Send Message

</button>


</form>



</div>





</section>







<!-- MAP -->


<section class="map">


<iframe

src="https://maps.google.com/maps?q=Kampala%20Uganda&t=&z=13&ie=UTF8&iwloc=&output=embed"

loading="lazy">

</iframe>


</section>







<footer>


<p>

© 2026 BusGo. All Rights Reserved.

</p>


</footer>





<script type="module" src="js/contact.js"></script>


</body>

</html>
